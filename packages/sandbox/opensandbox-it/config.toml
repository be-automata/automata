# OpenSandbox 1.2.1 server config for the OPENSANDBOX_IT harness (runs inside the osbit dind daemon only)
[server]
host = "0.0.0.0"
port = 8090
api_key = "__API_KEY__"
max_sandbox_timeout_seconds = 5400

[proxy]
resolve_internal = false

[log]
level = "INFO"

[runtime]
type = "docker"
execd_image = "osbit/execd:1.2.1"

[store]
type = "sqlite"
path = "/data/opensandbox.db"

[docker]
network_mode = "bridge"
host_ip = "127.0.0.1"
publish_host = "127.0.0.1"
port_range_min = 40000
port_range_max = 40999
drop_capabilities = ["AUDIT_WRITE", "MKNOD", "NET_ADMIN", "NET_RAW", "SYS_ADMIN", "SYS_MODULE", "SYS_PTRACE", "SYS_TIME", "SYS_TTY_CONFIG"]
no_new_privileges = true
pids_limit = 4096

[ingress]
mode = "direct"

[egress]
image = "osbit/egress:1.2.1"
mode = "dns+nft"
readiness_timeout_seconds = 60.0
