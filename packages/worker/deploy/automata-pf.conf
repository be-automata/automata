# /etc/automata-pf.conf — the ruleset the Automata pilot box actually loads (#108).
#
# WHY A WRAPPER AND NOT AN EDIT TO /etc/pf.conf. /etc/pf.conf is NOT SIP-protected,
# but Apple DOES rewrite it during OS updates — an edit there is silently reverted
# and the anchor disappears with it. Including Apple's file from ours keeps the
# system rules intact while letting our anchor survive an update of theirs.
#
# Install:  sudo install -o root -g wheel -m 0644 automata-pf.conf /etc/automata-pf.conf
# Load:     ./pf-preflight.sh _automata-agent     (never `pfctl -f` by hand)
# Verify:   ./pf-verify.sh
#
# ORDER MATTERS: `include` must come first so Apple's own scrub/anchor lines keep
# their position; pf requires options, then normalization, then queueing, then
# translation, then filtering.

include "/etc/pf.conf"

anchor "automata-egress"
load anchor "automata-egress" from "/etc/pf.anchors/automata-egress"
