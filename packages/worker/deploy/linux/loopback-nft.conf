# automata loopback fence — agent uid vs host-local services (#367)
#
# WHAT THIS IS: the second layer under egress-nft.conf. That table fences the
# agent uid off the internet on 80/443 and ACCEPTS ALL LOOPBACK on purpose,
# because the per-run egress proxy and the git broker listen there. But so do
# the Hatchet engine (gRPC :7077 with SERVER_GRPC_INSECURE, API :8888),
# cloudflared's metrics (:20241), sshd via the box's own public IP, and the
# engine container on the Docker bridge. Nothing told "the run's own broker"
# from "the engine". This table does, and it decides by WHO OWNS THE LISTENING
# SOCKET, not by a port list (decision D1):
#
#   out  (output hook)  every packet the agent uid sends over `lo` gets a mark;
#                       the agent uid toward a Docker bridge is a deny.
#   in   (input hook)   a NEW connection on `lo` carrying the mark is judged in
#                       agent_lo by the receiving socket's cgroup: under
#                       system.slice/automata-worker.service ⇒ the worker's
#                       proxy/broker or the agent's own test server ⇒ accept.
#                       Explicit exceptions: systemd-resolved (DNS) and the
#                       agent-facing test Postgres on :25432 (decision D2).
#                       Everything else is a deny.
#
# WHY A SEPARATE TABLE, LOADED BY THE WORKER UNIT, NOT AT BOOT. nft resolves
# `socket cgroupv2 "<path>"` to a cgroup INODE ID AT LOAD TIME. The worker's
# service cgroup does not exist when automata-egress.service runs
# (Before=automata-worker.service), and systemd recreates it on every worker
# restart, so a rule loaded once at boot is a load error or a stale id — and a
# stale id refuses the proxy and the broker too, so every run dies in seconds.
# automata-worker.service therefore (re)loads THIS table from ExecStartPre=+
# via nft-loopback-load.sh, after systemd created the cgroup and before the
# worker process can poll for work. A failed load fails the unit (fail-closed)
# and never touches inet automata_egress; the 80/443 fence never depends on the
# worker, and this layer never weakens it.
#
# A SOCKET CARRIES THE CGROUP OF THE TASK THAT CREATED IT. Measured on the box
# (2026-10-19): a listener whose socket was created inside the subtree is
# accepted; the same listener created outside and then MOVED into the subtree
# is refused, because sk_cgrp_data is fixed at socket creation. The worker,
# its proxy and broker, and every agent child are created inside the subtree,
# so this is a property to know, not a hole — nft-verify.sh starts its probe
# listeners after the move for exactly this reason.
#
# SAME IDIOM AS egress-nft.conf: own table, create-if-absent, delete, define.
# NEVER A GLOBAL FLUSH (Docker's chains, and with them the engine, would go).
#
# PLACEHOLDERS (nft-loopback-load.sh refuses an unrendered file):
#   __AGENT_UID__  the slot account uid(s), EXACTLY the set rendered into
#                  egress-nft.conf — `999` at one slot, `999, 2001` at two
#                  (#205). The loader refuses uid 0, the worker's own uid, and
#                  a set that misses a slot account.
#   __MARK__       the packet mark bit, 0x10000000. The loader refuses a mark
#                  that already appears anywhere else in the ruleset.
#
# ROLLOUT, TWO STEPS (same reasoning as the #108b note in egress-nft.conf: an
# over-broad fence presents as runs that die in seconds with no output):
#   1. OBSERVE (PR #383): every deny was
#        `counter limit rate … log prefix "automata-lo-deny " accept`
#      Nothing refused; every logged hit had to map to a "refused" row of
#      #367's target table or to a port with no listener at the time.
#   2. ENFORCE (this revision): the FOUR deny lines (bridge tcp, bridge
#      non-tcp, default tcp, default non-tcp) are the reject forms. Only `ct state new` is judged and the
#      restart that loads this ends every connection opened under observe, so
#      nothing carries over. To fall back to observe: the single observe
#      bridge line replaces the two bridge lines, and the two default lines
#      take the observe form (three lines, the PR #383 table); re-render,
#      restart idle.
#
# VERIFY:   packages/worker/deploy/linux/nft-verify.sh (loopback section)
# ROLLBACK: nft delete table inet automata_loopback   (immediate, scoped; the
#           unit reloads it on its next start — flip the conf for durability)
#           durable order: drop the ExecStartPre=+ line from the installed unit,
#           daemon-reload, delete the table, restart with no run in flight — the
#           other order leaves the unit pointing at a loader and refusing to start.

table inet automata_loopback
delete table inet automata_loopback

table inet automata_loopback {
  chain out {
    # policy accept: this table only ever ADDS denials (see egress-nft.conf).
    type filter hook output priority filter; policy accept;

    # Mark, do not judge, here: in the OUTPUT hook `socket` is the SENDER's
    # socket. The receiver is only known on the way back in, on `lo`.
    meta skuid { __AGENT_UID__ } oif "lo" meta mark set meta mark | __MARK__

    # Docker bridges. The agent has no Docker socket and no legitimate container
    # traffic; the engine container sits on one of these. nft-verify.sh checks
    # that every bridge on the box matches these names (a compose network with
    # its own bridge name would be an open path).
    # Two lines: `reject with tcp reset` is the only form that hands the agent
    # an immediate ECONNREFUSED from the OUTPUT hook (measured: a plain
    # `reject` here left the connect to time out at 1s); non-tcp gets EPERM.
    # OBSERVE form (the first rollout step, PR #383), one line:
    #   counter limit rate 20/second burst 100 packets log prefix "automata-lo-deny " accept
    meta skuid { __AGENT_UID__ } oifname { "docker0", "br-*" } meta l4proto tcp counter reject with tcp reset
    meta skuid { __AGENT_UID__ } oifname { "docker0", "br-*" } counter reject
  }

  chain in {
    type filter hook input priority filter; policy accept;
    # Only the agent's NEW connections over lo. Replies, established flows and
    # every other uid's traffic never enter agent_lo.
    iif "lo" meta mark & __MARK__ == __MARK__ ct state new jump agent_lo
  }

  chain agent_lo {
    # The receiving socket's cgroup, level 2 = the worker's unit. The worker
    # (supervisor/), its per-run proxy and git broker, and the agent's own
    # servers (run-<id>/) all create their sockets under it.
    socket cgroupv2 level 2 "system.slice/automata-worker.service" counter accept

    # systemd-resolved's stub listeners: the agent needs DNS.
    ip daddr { 127.0.0.53, 127.0.0.54 } meta l4proto { tcp, udp } th dport 53 counter accept

    # Decision D2: the agent-facing test Postgres (install-test-postgres.sh),
    # password-gated; the agent cannot read /etc/automata/test-postgres.password.
    ip daddr 127.0.0.1 tcp dport 25432 counter accept

    # ICMP to a local address (`ping 127.0.0.1`, allowed to any uid by Ubuntu's
    # ping_group_range) has no listening socket and would otherwise land on the
    # default deny. No service answers it; admit it rather than log noise.
    meta l4proto { icmp, ipv6-icmp } counter accept

    # Everything else on the host: the engine (docker-proxy), cloudflared, sshd,
    # a CLOSED port (no socket ⇒ no cgroup ⇒ lands here; under enforce the
    # agent gets the same reset the kernel would have sent), and whatever is
    # added later. Default-deny, observable: `counter` sees every packet; the
    # log is rate-limited so a run cannot flood the kernel log, and an
    # over-limit packet falls off the chain to the same `accept` (observe).
    # `reject with tcp reset`: ECONNREFUSED in the agent's own log, not a
    # connect timeout. OBSERVE form (PR #383): `counter limit rate 20/second
    # burst 100 packets log prefix "automata-lo-deny " accept` on both lines.
    meta l4proto tcp counter reject with tcp reset
    meta l4proto != tcp counter reject
  }
}
