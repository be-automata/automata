# automata loopback fence — Linux nftables template (#367)
#
# WHAT THIS IS: default-deny for the agent uid toward HOST-LOCAL services and the
# Docker bridges. inet automata_egress accepts all loopback on purpose, because
# the per-run egress proxy and the git broker listen there. That also left the
# agent able to reach the Hatchet engine (127.0.0.1:7077 insecure gRPC, :8888),
# cloudflared's metrics (:20241), the engine container over the bridge, and the
# box's own sshd via its public IP. The engine still wants a token; this closes
# the layer underneath it.
#
# HOW IT DECIDES: by WHO OWNS THE LISTENING SOCKET, not by a port list. Every
# listener that legitimately serves the agent (the proxy, the git broker, the
# agent's own test servers) runs in a cgroup under
# system.slice/automata-worker.service; everything to refuse (docker-proxy,
# postgresql, cloudflared, sshd) does not. The output hook marks the agent's
# loopback packets; the input hook then looks up the receiving socket's cgroup.
# DNS (systemd-resolved) and the test Postgres (127.0.0.1:25432,
# install-test-postgres.sh) are the two named exceptions.
#
# ── WHY THE WORKER UNIT LOADS THIS, NOT automata-egress.service ─────────────
#
# nft resolves a `socket cgroupv2` path to a cgroup INODE ID AT LOAD TIME.
# automata-egress.service runs Before= the worker, when that cgroup does not
# exist yet, and systemd recreates it on every worker restart, which changes the
# id. A rule loaded once at boot is a load error or stale, and a stale rule
# refuses the proxy and the broker too: every run dies in seconds. So
# automata-worker.service reloads this table in an ExecStartPre (the cgroup
# exists by then) through nft-loopback-load.sh, and a failed load stops the unit
# before the worker can poll for work.
#
# It is a SEPARATE TABLE so a failed load never weakens the 80/443 fence, and the
# 80/443 fence never depends on the worker. Same idempotent-replace idiom as
# egress-nft.conf; NEVER a global flush (see that file's header: it takes
# Docker's chains, and the engine, with it).
#
# ── OBSERVE, THEN ENFORCE ────────────────────────────────────────────────────
#
# This ships in OBSERVE mode: every deny verdict is
# `counter log prefix "automata-lo-deny " accept`, so nothing is refused yet. An
# over-broad fence presents as runs that die in seconds with no output (the
# #108b note in egress-nft.conf), so the log runs for 7 days or 30 agent runs,
# whichever is later, and every hit must map to a destination the fence is meant
# to refuse. The enforce flip replaces each observe verdict with the form named
# in the `ENFORCE:` comment above it, then restarts the worker once no run is in
# flight. Only `ct state new` is inspected, so the restart is what ends every
# connection opened under observe.
#
# PLACEHOLDERS (nft-loopback-load.sh refuses to load an unrendered file):
#   __AGENT_UID__  `id -u automata-agent`. Never 0, never the worker's own uid.
#   __MARK__       0x10000000. The loader refuses it if any other table already
#                  uses that value.
#
# LIMITS: per-run isolation is NOT provided. Concurrent runs both sit under the
# worker subtree, so run A could reach run B's test servers; matching the run's
# own cgroup (level 4) is the follow-up once a box runs more than one slot.
# AF_UNIX sockets (gh broker, daemon socket) never traverse netfilter.
#
# VERIFY:  packages/worker/deploy/linux/nft-verify.sh (loopback section)
# ROLLBACK (immediate, leaves automata_egress and Docker untouched):
#   nft delete table inet automata_loopback

table inet automata_loopback
delete table inet automata_loopback

table inet automata_loopback {
  chain out {
    type filter hook output priority filter; policy accept;

    # Tag every packet the agent sends to a host-local destination. The mark
    # survives lo into the input hook, where the receiving socket is known.
    meta skuid __AGENT_UID__ oif "lo" meta mark set meta mark | __MARK__

    # The agent has no Docker socket and no legitimate container traffic.
    # Two rules, not a set: wildcard names inside an anonymous set need a newer
    # nft than the box runs.
    # ENFORCE: meta skuid __AGENT_UID__ oifname "docker0" counter reject
    meta skuid __AGENT_UID__ oifname "docker0" counter log prefix "automata-lo-deny " accept
    # ENFORCE: meta skuid __AGENT_UID__ oifname "br-*" counter reject
    meta skuid __AGENT_UID__ oifname "br-*" counter log prefix "automata-lo-deny " accept
  }

  chain in {
    type filter hook input priority filter; policy accept;

    # New connections only: replies to the agent are not marked, and nothing
    # already established is re-judged.
    iif "lo" meta mark & __MARK__ == __MARK__ ct state new jump agent_lo
  }

  chain agent_lo {
    # Level 2 of /sys/fs/cgroup: the worker unit's cgroup and every per-run
    # cgroup below it (run-cgroup.ts), which is where the proxy, the git broker
    # and the agent's own test servers own their sockets.
    socket cgroupv2 level 2 "system.slice/automata-worker.service" accept

    # systemd-resolved stub and its alternate.
    ip daddr { 127.0.0.53, 127.0.0.54 } meta l4proto { tcp, udp } th dport 53 accept

    # Test Postgres for TEST_SERVICES_REPOS runs; password-gated, and the agent
    # cannot read the password file.
    ip daddr 127.0.0.1 tcp dport 25432 accept

    # ENFORCE: meta l4proto tcp counter reject with tcp reset
    meta l4proto tcp counter log prefix "automata-lo-deny " accept
    # ENFORCE: counter reject
    counter log prefix "automata-lo-deny " accept
  }
}
