# automata egress backstop — Linux nftables template (#192 P7)
#
# The Linux counterpart of deploy/egress-pf.conf. Same job, same argument:
#
# WHAT THIS IS: the host-level backstop for the worker's per-run egress
# filtering proxy (packages/worker/src/agent-run/egress-proxy.ts). The proxy is
# COOPERATIVE — it only sees traffic from clients that honour HTTP(S)_PROXY. A
# child that unsets those env vars talks to the network directly. This ruleset
# closes that bypass at the packet level for the agent's uid, except loopback,
# which is where the per-run proxy and the git broker listen.
#
# WHAT THIS IS NOT: per-run or automatic. nftables needs root and is host-global,
# so unprivileged worker code cannot load it per run. This is a TEMPLATE the
# operator renders and loads via nft-preflight.sh.
#
# ── THE THING THAT WILL BITE YOU: DO NOT GO THROUGH /etc/nftables.conf ──────
#
# Ubuntu's stock /etc/nftables.conf begins with `flush ruleset`. Docker keeps its
# NAT and filter chains in the kernel ruleset and does NOT re-create them on
# demand — on the pilot box it owns 34 chains across `ip nat`, `ip filter`,
# `ip6 nat`, `ip6 filter` and `ip raw`. Appending this file there, or running
# `systemctl enable --now nftables` with the stock config, wipes those chains and
# takes down container networking — which on this box means the Hatchet engine
# and its Postgres. Verified on the box before this file was written.
#
# So: OWN TABLE, OWN UNIT, NEVER A GLOBAL FLUSH. The three lines below are the
# idempotent-replace idiom — create-if-absent, delete, define — which touches
# nothing but `inet automata_egress`.
#
# Ordering against Docker does not matter for correctness. nftables evaluates
# EVERY base chain registered at a hook; `accept` is local to its own chain,
# while `drop`/`reject` anywhere is final. Our verdict therefore stands no matter
# what Docker's chains say. The explicit priority is for legibility, not effect.
#
# PLACEHOLDERS (nft-preflight.sh refuses to load an unrendered file):
#   __AGENT_UID__  numeric uid(s) of the DEDICATED ROLE ACCOUNT(S) the agent child
#                  runs as. One slot (`WORKER_BOX_SLOTS=1`): `id -u automata-agent`.
#                  Several slots (#205): every slot account's uid, comma-separated
#                  — e.g. `999, 2001, 2002` for automata-agent, automata-agent-1,
#                  automata-agent-2 — rendered inside the anonymous set below.
#                  None may be the worker's own uid and none may be 0. Fencing
#                  the worker kills the control-plane poll, the git broker's
#                  upstream fetch and the credential pull — i.e. every run on the
#                  box. The preflight refuses both, for every uid in the set.
#
# VERIFY:  packages/worker/deploy/linux/nft-verify.sh
# ROLLBACK (scoped, leaves Docker untouched). The coverage marker goes FIRST
# (#205): with it left behind, a worker restarted at WORKER_BOX_SLOTS > 1 would
# read a fence that is no longer loaded. `systemctl stop automata-egress` does both.
#   rm -f /run/automata/egress-fence.uids; nft delete table inet automata_egress

table inet automata_egress
delete table inet automata_egress

table inet automata_egress {
  chain egress {
    # policy accept: this table only ever ADDS denials. A drop policy on the
    # output hook would fence the whole box, including sshd's replies.
    type filter hook output priority filter; policy accept;

    # Loopback first and unconditionally: the per-run egress proxy, the git
    # broker, the gh broker and the daemon's socket all live on this host, and
    # the engine is reached over 127.0.0.1 too.
    #
    # This `accept` is local to THIS chain: it ends evaluation here, not in the
    # kernel. What the agent uid may reach ON loopback is decided by the separate
    # table `inet automata_loopback` (loopback-nft.conf, #367), judged in the
    # INPUT hook by the receiving socket's cgroup and loaded by the worker unit
    # itself. Keeping the two apart means a failed loopback load never weakens
    # this 80/443 fence, and this boot-time fence never depends on the worker.
    oif "lo" accept

    # Default-deny direct outbound web traffic for the agent uid. Everything the
    # run legitimately needs rides through the loopback proxy above, which then
    # egresses as the WORKER process, not the agent uid.
    #
    # `meta skuid` is the Linux equivalent of PF's `user` match: it reads the
    # socket owner of a locally generated packet, which is exactly the agent
    # child. It is meaningful only in the output hook — there is no socket owner
    # for forwarded traffic.
    #
    # BOTH tcp AND udp. udp/443 is QUIC / HTTP-3, which curl and modern HTTP
    # libraries speak natively; a tcp-only rule leaves an https bypass that never
    # touches the proxy.
    #
    # REJECT, not drop — a deliberate divergence from the macOS template. A
    # silent drop makes the agent sit on its connect timeout and the run dies
    # "in seconds with no output", which is the exact forensics class this work
    # exists to remove. A reject surfaces as ECONNREFUSED in the agent's own log,
    # naming its own cause.
    # `counter` makes the backstop OBSERVABLE. A fence that has never fired
    # and a fence that fires constantly look identical without it, and the
    # difference is the whole question: a rising count means a run really is
    # trying to egress around the cooperative proxy. nft-verify.sh prints it.
    # An anonymous SET, so one rule fences every slot account (#205). With a
    # single uid nft prints it back as the bare scalar; nft-verify.sh accepts both.
    meta skuid { __AGENT_UID__ } tcp dport { 80, 443 } counter reject with tcp reset
    meta skuid { __AGENT_UID__ } udp dport { 80, 443 } counter reject
  }
}

# NOTE: ports other than 80/443 stay open (DNS, ssh, package mirrors). Tightening
# to all ports is the #108b follow-up and is gated on observe-mode data: a
# full-port block breaks DNS (udp/53), ssh, and any repo whose tests talk to a
# local service on a non-web port — each of which manifests as a run that dies
# in seconds with no output.
