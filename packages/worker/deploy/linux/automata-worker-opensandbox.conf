# Drop-in for automata-worker.service on a box that hosts the OpenSandbox server
# (#656). install-opensandbox.sh installs it as
# /etc/systemd/system/automata-worker.service.d/opensandbox.conf, after the key
# file exists: LoadCredential= fails the unit when the file is missing. PID 1
# hands the key to this unit alone, at $CREDENTIALS_DIRECTORY/opensandbox.env.
[Service]
LoadCredential=opensandbox.env:/etc/automata/opensandbox.env
