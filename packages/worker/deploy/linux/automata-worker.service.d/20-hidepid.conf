# Opt-in drop-in for #205's N > 1 (WORKER_BOX_SLOTS > 1). Install ONLY on a box
# that runs more than one slot, together with the host /proc remount
# (AGENT-UID-PROVISIONING.md §6); REMOVE it when the box returns to N = 1 — it
# relaxes hardening that a one-slot box does not need to give up.
#
# Why: the hidepid fence must hold in the mount namespace the AGENTS run in.
# `ProtectSystem=` and `ProtectKernelTunables=` give the unit a private mount
# namespace with a FRESH /proc that lacks the host's `hidepid=`, and a mount made
# in ExecStartPre does not persist into ExecStart (measured on the box: the worker
# crash-looped on its own N > 1 boot check, "/proc is mounted without hidepid",
# with the host /proc correctly remounted). With both off the unit shares the host
# namespace: the host's /proc (hidepid=invisible,gid=<worker group>) is what the
# slot accounts see, and the worker (exempt through its group) still sees every
# slot's processes for the reaper and the ceiling.
#
# What stays: everything else in the base unit — ProtectControlGroups=yes (relaxed
# only by 10-ceiling.conf), ReadWritePaths, the service User= and the agent-uid
# fence (ProtectHome and NoNewPrivileges are already off in the base unit: the
# sudo path to the agent accounts needs them so). The worker's own boot check is
# the fail-closed guard: without this drop-in an N > 1 boot refuses to start, and
# a one-slot boot that still sees hidepid inside the unit WARNS that this file was
# left behind (hidepidDropinLeftAtOneSlot).

[Service]
ProtectSystem=no
ProtectKernelTunables=no
