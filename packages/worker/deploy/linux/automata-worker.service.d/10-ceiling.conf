# Opt-in drop-in for #204's per-run memory ceiling. Install ONLY on a box whose
# worker-box.env sets WORKER_RUN_MEMORY_MAX.
#
# It exists so the base unit can keep `ProtectControlGroups=yes`: that directive
# remounts /sys/fs/cgroup read-only inside the unit's namespace, which makes a
# delegated subtree correctly OWNED and completely unwritable — the ceiling then
# cannot be armed, and the worker reports "the unit needs Delegate=" while
# Delegate= is right there. Relaxing it in the base unit would weaken hardening
# on every box, including ones that never cap a run.
#
# What the relaxation costs: the worker's service account can write its OWN
# delegated subtree. What it does not cost: the AGENT uid gains nothing. Every
# file in a run cgroup stays worker-owned — the same property that stops the agent
# raising its own memory.max — and the agent has no write access to the worker's
# subtree at all.
#
# Of ProtectControlGroups, ProtectKernelTunables and ProtectSystem=full, only the
# first breaks delegation. The other two stay in the base unit and are not
# touched here.

# WHY DELEGATION AND NOT A TRANSIENT SCOPE. #193 specified
# `systemd-run --scope --uid=<agent>`. Measured on the box, it cannot work here:
# as the unit's User= the scope is refused by polkit ("Interactive authentication
# required"), `--user` has no bus (the account is not logged in and does not
# linger), and making it possible needs either a sudoers entry for `systemd-run`
# (arbitrary root — sudoers(5) permits any arguments for a bare command path, and
# `--uid=0` is one) or a polkit rule amounting to "start any transient unit as any
# uid". Someone will propose the scope again; the measurement that killed it
# belongs next to the line that replaced it.

[Service]
# NARROW, not `Delegate=yes`: only the two controllers the ceiling uses. Widening
# it hands the worker every other controller for no gain.
#
# The worker moves itself into a `supervisor/` leaf at boot before enabling the
# controllers, because cgroup v2 refuses to enable them for the children of a
# cgroup that still holds processes. Without that the enable fails EBUSY.
Delegate=memory pids

# Overrides the base unit's `ProtectControlGroups=yes`. Without this the
# delegation above is inert.
ProtectControlGroups=no
