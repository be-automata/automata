name: Migrate production

# Applies deploy/migrations to the production database once CI is green on
# main, so a merged schema change never waits on someone holding the DB URL.
#
#   CI succeeds on a push to main  →  this workflow, on THAT commit:
#     dry run → apply --no-contract → assert-schema-ready
#   workflow_dispatch (from main)
#     → same, and `allow_contract: true` also applies `migrate:contract` files
#
# Triggered by CI (workflow_run), not by the push itself: main has no branch
# protection, so a push with red CI must not reach the production schema. Every
# green main commit runs it; with nothing pending, plan and apply are no-ops,
# which also catches up on any run that was skipped or cancelled.
#
# A contract file drops schema the deployed revision may still read, and the
# www/worker deploy is a separate manual step that can lag main, so the
# unattended run refuses it (deploy/migrate.ts exits 2). Deploy the code that
# no longer reads the removed schema, then run this workflow by hand with
# allow_contract.
#
# A failed run opens (or comments on) one issue labelled migrate-failure.
#
# Setup (once):
#   Settings → Environments → `production`; add required reviewers there if a
#   human should approve each run.
#   gh secret set PROD_DATABASE_URL --env production
#     The direct Neon host (not `-pooler.`): the runner holds a session
#     advisory lock that a pooler cannot keep.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      allow_contract:
        description: "Also apply migrate:contract files (only after the code that stops reading the removed schema is deployed)"
        type: boolean
        default: false

permissions:
  contents: read

# One run at a time, never cancelled mid-apply: a second run queues behind the
# first (the runner's advisory lock is the database-side backstop).
concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    # Only after a green CI run of a push to main (not a PR, not a failure),
    # or a manual dispatch from main.
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_branch == 'main')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    # DATABASE_URL is set per step, never job-wide: `pnpm install` runs
    # third-party install scripts, and they must not see the production URL.
    # Actions are pinned to commit SHAs because this job holds that URL.
    steps:
      - name: Require the database secret
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::PROD_DATABASE_URL is not set on the production environment (gh secret set PROD_DATABASE_URL --env production)"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The commit CI just passed (workflow_run), else the dispatched ref.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Plan (dry run)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: pnpm exec tsx deploy/migrate.ts
      - name: Apply
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          EVENT_NAME: ${{ github.event_name }}
          ALLOW_CONTRACT: ${{ inputs.allow_contract }}
        # Decided in shell: an Actions expression `x && '' || y` always yields y
        # ('' is falsy), which would silently ignore allow_contract.
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$ALLOW_CONTRACT" = "true" ]; then
            pnpm exec tsx deploy/migrate.ts --apply
          else
            pnpm exec tsx deploy/migrate.ts --apply --no-contract
          fi
      - name: Assert the schema this revision needs is present
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: pnpm exec tsx deploy/assert-schema-ready.ts

  # A failed production migration must not be silent. Separate job so the
  # issues:write token never shares a job with the database URL.
  notify:
    needs: migrate
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Open or comment on the migrate-failure issue
        run: |
          gh label create migrate-failure --color B60205 \
            --description "Production migration workflow failed" 2>/dev/null || true
          body="Production migration failed for \`$COMMIT\`: $RUN_URL"
          existing=$(gh issue list --label migrate-failure --state open --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Production migration failed" \
              --label migrate-failure --body "$body"
          fi
