# Builds the batteries image (ADR-013), verifies it, and on main pushes it to
# public GHCR and attests its provenance. The box pins the pushed DIGEST, never
# a tag; the digest is written to the job summary.
name: batteries-image

on:
  # The build context is deploy/images/batteries (the Dockerfile, verify.sh
  # and the gsd/, ruflo/ and somnio-cli/ lockfiles), so one glob covers it.
  push:
    branches: [main]
    paths:
      - "deploy/images/batteries/**"
      - ".github/workflows/batteries-image.yml"
  pull_request:
    paths:
      - "deploy/images/batteries/**"
      - ".github/workflows/batteries-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: batteries-image-${{ github.ref }}
  # A newer push to a PR supersedes its build; main builds always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/be-automata/automata-batteries

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write # push to GHCR (main only)
      id-token: write # sign the provenance attestation (main only)
      attestations: write
    steps:
      # The image is several GB unpacked; a stock runner has ~14 GB free. Drop
      # preinstalled toolchains this job never uses.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune --all --force >/dev/null
          df -h /

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # No secret may enter the image: scan everything the build reads (the
      # Dockerfile dir is the build context) with the same pinned gitleaks the
      # image ships.
      - name: Secret scan of the build inputs
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c --quiet -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner deploy/images/batteries

      # buildx with the default `docker` driver: the image lands straight in
      # the local image store (no second copy from a builder container), which
      # verify.sh runs and `docker push` sends.
      - name: Build (linux/amd64)
        run: |
          docker buildx build --platform linux/amd64 \
            -f deploy/images/batteries/Dockerfile \
            -t automata-batteries:ci --load \
            deploy/images/batteries
          docker image inspect automata-batteries:ci --format 'size {{.Size}} bytes'

      - name: Verify
        run: deploy/images/batteries/verify.sh automata-batteries:ci

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        if: github.ref == 'refs/heads/main'
        run: |
          tag="${IMAGE}:sha-${GITHUB_SHA}"
          docker tag automata-batteries:ci "$tag"
          docker push "$tag"
          ref="$(docker image inspect "$tag" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep -F "${IMAGE}@" | head -n 1)"
          digest="${ref#*@}"
          case "$digest" in sha256:*) ;; *) echo "no pushed digest for $tag" >&2; exit 1 ;; esac
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          {
            echo "### Batteries image"
            echo
            echo "Pin this reference (never the tag):"
            echo
            echo '```'
            echo "WORKER_BATTERIES_IMAGE=${IMAGE}@${digest}"
            echo '```'
            echo
            echo "Tag: \`$tag\`"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Attest provenance
        if: steps.push.outcome == 'success'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
