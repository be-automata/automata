name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No job here writes to the repo or calls the API; keep the token read-only
# (the repository default is write).
permissions:
  contents: read

# A newer push supersedes a PR run, but a main run always finishes: a green
# main run is what triggers migrate.yml, and with frequent merges cancelling
# them meant no main run ever reached green. A queued main run is still
# replaced by a newer one, so main runs at most one-running-one-pending.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ── Security gate: no CRITICAL advisory may reach production deps ───────────
  # Runs the same scan the security audit scored 3/100 before remediation; the
  # gate is critical-only so an unfixable HIGH (no patched release upstream)
  # cannot wedge every PR — Dependabot's security group handles those the day
  # a patch exists.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      # No `cache: pnpm` here: audit reads pnpm-lock.yaml without installing,
      # so there is no store to save and the cache post-step would fail the job.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pnpm audit --prod --audit-level critical

  # ── Static checks: tsc (all packages), lint, format ──────────────────────────
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # The .pnpmfile.cjs strips drizzle-orm's optional peers so pnpm keeps ONE
      # hoisted copy — without it, drizzle's branded types stop crossing the
      # shared→www boundary and tsc breaks. Fail loudly if that regresses.
      - name: Verify single drizzle-orm resolution (.pnpmfile.cjs)
        run: |
          shared=$(readlink -f node_modules/.pnpm/*/node_modules/drizzle-orm 2>/dev/null | head -1)
          s=$(readlink packages/shared/node_modules/drizzle-orm | sed -E 's#.*/(drizzle-orm@[^/]*)/.*#\1#')
          w=$(readlink apps/www/node_modules/drizzle-orm | sed -E 's#.*/(drizzle-orm@[^/]*)/.*#\1#')
          echo "shared -> $s ; www -> $w"
          if [ "$s" != "$w" ]; then echo "::error::drizzle-orm forked ($s vs $w) — .pnpmfile.cjs not applied"; exit 1; fi

      # apps/docs (Fumadocs) generates `.source` via fumadocs-mdx; without it
      # tsc-check fails on missing `@/.source`. Run it before the type check.
      - name: Fumadocs codegen (apps/docs)
        run: pnpm --filter @terragon/docs exec fumadocs-mdx

      - name: Type check (all packages)
        run: pnpm turbo tsc-check
      - name: Lint
        run: pnpm turbo lint
      - name: Format check
        run: pnpm turbo format-check
      # deploy/ has no package.json: its scripts run on Node's own type
      # stripping. node --test takes a glob, not a directory, so quote it.
      - name: Deploy script tests (node --test)
        run: node --test 'deploy/*.test.ts'
      - name: Migration lint
        run: node deploy/lint-migrations.ts deploy/migrations

  # ── Tests: serialized `vitest run` per package + review (node --test) ─────────
  # Bare `turbo test` runs the packages' watch-mode `vitest` scripts, which in CI
  # silently no-op several suites. We invoke `vitest run --no-file-parallelism`
  # explicitly per package. The Postgres-backed suites (shared, www) provision
  # their own throwaway DB via packages/dev-env test-global-setup, which uses
  # `docker compose` (available on ubuntu-latest) — no `services:` container.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Tests (serialized, controlled env)
        env:
          CI: "true"
        run: |
          set -eo pipefail
          # WI-9 controlled env: drop any host/runner leaks that would misdirect
          # the driver / DB / sandbox provider. The harness sets its own DATABASE_URL.
          unset DATABASE_URL DB_DRIVER SANDBOX_PROVIDER NODE_ENV NEXT_PUBLIC_APP_URL

          run_pkg() { echo "::group::vitest $1"; pnpm --filter "$1" exec vitest run --no-file-parallelism; echo "::endgroup::"; }

          run_pkg @terragon/utils
          # Grounded knowledge claims engine (#364).
          run_pkg @terragon/knowledge
          run_pkg @terragon/agent
          run_pkg @terragon/shared
          run_pkg @terragon/www
          run_pkg @terragon/daemon
          run_pkg @terragon/sandbox
          # deploy/migrations runner: fresh-DB apply, drift, locks, CONCURRENTLY.
          run_pkg @terragon/migrate
          # #171: the execution plane's own unit suite. worker-e2e below is NOT
          # a substitute — it runs four integration files against hatchet-lite.
          run_pkg @terragon/worker

          echo "::group::review (node --test)"
          pnpm --filter @terragon/review test
          echo "::endgroup::"

  # ── Schema drift: deploy/migrations vs packages/shared/src/db/schema.ts ──────
  # Builds database `a` from the migration files and database `b` from
  # schema.ts (drizzle-kit push), then compares their pg_catalog. A schema.ts
  # change without a migration (or a migration schema.ts does not describe)
  # fails here. Postgres 18 = the production major (the test compose is 16).
  schema-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PG_BASE: postgres://postgres:postgres@localhost:5432
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Create databases a (migrations) and b (schema.ts)
        run: |
          createdb a
          createdb b
      - name: Apply deploy/migrations to a (twice; the second applies 0)
        env:
          DATABASE_URL: ${{ env.PG_BASE }}/a
        run: |
          set -eo pipefail
          pnpm exec tsx deploy/migrate.ts --apply
          pnpm exec tsx deploy/migrate.ts --apply | tee "$RUNNER_TEMP/second.txt"
          grep -qx 'applied 0 migration(s)' "$RUNNER_TEMP/second.txt" \
            || { echo "::error::second migrate run was not a no-op"; exit 1; }
      - name: Push schema.ts to b (drizzle-kit push)
        env:
          DATABASE_URL: ${{ env.PG_BASE }}/b
        run: pnpm -C packages/shared exec drizzle-kit push --force
      - name: Compare a with b
        run: pnpm exec tsx deploy/schema-drift.ts --a "$PG_BASE/a" --b "$PG_BASE/b"

  # ── Worker E2E vs dockerized hatchet-lite (#125 C3 / #128) ───────────────────
  # Isolated compose project (own ports; see hatchet-it-harness.ts), ~2 min,
  # torn down in `if: always()` as the backstop for a killed vitest process.
  worker-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
      - name: Install dependencies (worker closure only)
        run: pnpm install --frozen-lockfile --prefer-offline --filter "@terragon/worker..."
      - name: Provision the uid-reaper IT account (#184)
        run: sudo useradd -r -s /usr/sbin/nologin automata-it-agent
      - name: Supersede-policy E2E + scheduling-health IT (HATCHET_IT=1)
        env:
          HATCHET_IT: "1"
          HOST_UID_IT: "1"
        run: |
          pnpm --filter @terragon/worker exec vitest run --no-file-parallelism \
            src/agent-run/supersede.integration.test.ts \
            src/agent-run/scheduling-health.integration.test.ts \
            src/agent-run/box-lock.test.ts \
            src/agent-run/uid-reaper.integration.test.ts \
            src/agent-run/self-heal-box-lock.integration.test.ts \
            src/agent-run/admission-deferral.integration.test.ts \
            src/agent-run/payload-seal.integration.test.ts \
            src/agent-run/burst.integration.test.ts
      - name: Tear down (always)
        if: always()
        run: docker compose -p automata-hatchet-it down -v --remove-orphans || true

  # ── Browser E2E: two-org Playwright suite against `next start` ──────────────
  # apps/www/e2e/run.ts provisions a throwaway Postgres (docker compose via
  # @terragon/dev-env), pushes the schema, seeds two orgs and signed sessions,
  # then runs Playwright. The server's outbound calls go through an egress
  # guard: GitHub is answered from fixtures and any other host fails the run.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Egress-guard host parsing (node --test)
        run: node --test apps/www/e2e/support/egress-host.node-test.mjs
      - name: Install Chromium
        run: pnpm --filter @terragon/www exec playwright install --with-deps chromium
      - name: Build workspace dependencies of www
        run: pnpm turbo build --filter='@terragon/www^...'
      # `e2e:build` is `next build` with the e2e env (e2e/e2e-env.ts): the
      # NEXT_PUBLIC_* values are inlined, so the build must name the URL the
      # suite serves on.
      - name: Build www
        run: pnpm --filter @terragon/www e2e:build
      - name: Playwright
        env:
          CI: "true"
        run: |
          unset DATABASE_URL DB_DRIVER SANDBOX_PROVIDER NODE_ENV NEXT_PUBLIC_APP_URL
          pnpm --filter @terragon/www e2e
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: |
            apps/www/test-results
            apps/www/playwright-report
          retention-days: 7
