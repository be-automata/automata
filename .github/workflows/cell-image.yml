# Builds the cell guest image (ADR-014, #656): the batteries image by digest
# plus the daemon bundle and the entry scripts. Verifies it, and on main pushes
# it to public GHCR and attests its provenance. The box pins the pushed DIGEST,
# never a tag; the digest is written to the job summary.
name: cell-image

on:
  push:
    branches: [main]
    paths:
      - "deploy/images/cell/**"
      - "packages/daemon/**"
      - "packages/agent/**" # a daemon dependency
      - "pnpm-lock.yaml"
      - ".github/workflows/cell-image.yml"
  pull_request:
    paths:
      - "deploy/images/cell/**"
      - "packages/daemon/**"
      - "packages/agent/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/cell-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cell-image-${{ github.ref }}
  # A newer push to a PR supersedes its build; main builds always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/be-automata/automata-cell

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write # push to GHCR (main only)
      id-token: write # sign the provenance attestation (main only)
      attestations: write
    steps:
      # The base layers are about 8.3 GB unpacked; a stock runner has ~14 GB
      # free. Drop preinstalled toolchains this job never uses.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune --all --force >/dev/null
          df -h /

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Build the daemon bundle
        run: |
          pnpm install --frozen-lockfile --prefer-offline --filter "@terragon/daemon..."
          pnpm --filter @terragon/daemon build

      # Same shape the box stages: one bundle file beside the scripts. No
      # source map, no repo-root context.
      - name: Stage the build context
        run: |
          ctx="$RUNNER_TEMP/cell-ctx"
          mkdir -p "$ctx/daemon"
          install -m 0644 deploy/images/cell/Dockerfile "$ctx/Dockerfile"
          install -m 0755 deploy/images/cell/cell-entry.sh "$ctx/cell-entry.sh"
          install -m 0755 deploy/images/cell/cell-send.sh "$ctx/cell-send.sh"
          install -m 0444 packages/daemon/dist/index.js "$ctx/daemon/index.js"
          find "$ctx" -type f | sort

      # No secret may enter the image: scan exactly what the build reads.
      - name: Secret scan of the staged context
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c --quiet -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner "$RUNNER_TEMP/cell-ctx"

      # buildx with the default `docker` driver: the image lands straight in
      # the local image store, which verify.sh runs and `docker push` sends.
      - name: Build (linux/amd64)
        run: |
          docker buildx build --platform linux/amd64 \
            --build-arg "REVISION=$GITHUB_SHA" \
            -t automata-cell:ci --load \
            "$RUNNER_TEMP/cell-ctx"
          docker image inspect automata-cell:ci --format 'size {{.Size}} bytes'

      - name: Verify
        run: deploy/images/cell/verify.sh automata-cell:ci

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        if: github.ref == 'refs/heads/main'
        run: |
          tag="${IMAGE}:sha-${GITHUB_SHA}"
          docker tag automata-cell:ci "$tag"
          docker push "$tag"
          ref="$(docker image inspect "$tag" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep -F "${IMAGE}@" | head -n 1)"
          digest="${ref#*@}"
          case "$digest" in sha256:*) ;; *) echo "no pushed digest for $tag" >&2; exit 1 ;; esac
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          {
            echo "### Cell image"
            echo
            echo "Pin this reference (never the tag):"
            echo
            echo '```'
            echo "OPENSANDBOX_GUEST_IMAGE=${IMAGE}@${digest}"
            echo '```'
            echo
            echo "Tag: \`$tag\`"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Attest provenance
        if: steps.push.outcome == 'success'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
