# automata egress backstop — macOS PF anchor template (#66 slice 2)
#
# WHAT THIS IS: the host-level backstop for the worker's per-run egress
# filtering proxy (packages/worker/src/agent-run/egress-proxy.ts). The proxy is
# COOPERATIVE — it only sees traffic from clients that honour HTTP(S)_PROXY. A
# child that unsets those env vars talks to the network directly. This anchor
# closes that bypass at the packet level: default-deny outbound web traffic
# (80/443) for the agent's uid, except loopback — which is where the per-run
# proxy and the git broker listen, so proxied traffic still flows.
#
# WHAT THIS IS NOT: per-run, automatic, or CI-verified. macOS PF needs root and
# is host-global; unprivileged worker code cannot load it per run. This file is
# a TEMPLATE the operator edits and loads MANUALLY on the pilot box (see
# deploy/PILOT-RUNBOOK.md, "Egress enforcement backstop"). Without it, the
# env-unset bypass exists on the worker plane — stated plainly, not papered over.
#
# PLACEHOLDERS (edit before loading):
#   __AGENT_UID__  the numeric uid of the DEDICATED ROLE ACCOUNT the worker runs
#                  the agent child as — `id -u _automata-agent` (#108). It must
#                  NEVER be the worker's own uid. Fencing the worker would kill
#                  the control-plane poll, the git broker's upstream fetch and
#                  the credential pull, i.e. every run on the box. The preflight
#                  script refuses to load a rendering that names uid 501 or a uid
#                  that does not match the configured agent account.
#
# LOAD: do NOT run pfctl by hand and do NOT edit /etc/pf.conf (Apple rewrites it
# on OS updates). Use the wrapper conf + scripts shipped alongside this file:
#   packages/worker/deploy/automata-pf.conf        (includes /etc/pf.conf)
#   packages/worker/deploy/pf-preflight.sh         (validates, then loads)
#   packages/worker/deploy/pf-verify.sh            (proves it stayed loaded)
#   packages/worker/deploy/com.automata.pf.plist   (reloads at boot)
# See packages/worker/deploy/AGENT-UID-PROVISIONING.md.
#
# VERIFY:
#   pfctl -a automata-egress -sr        # non-empty
#   pfctl -s info                       # "Status: Enabled"
#   sudo -u _automata-agent curl -m 5 https://example.com   # must hang/fail
#
# UNLOAD (rollback, scoped):  pfctl -a automata-egress -F rules
# UNLOAD (nuclear):           pfctl -d
# Neither can lock anyone out of the local console: PF filters network paths only.

# Loopback stays open: the per-run egress proxy, the git broker, and the
# daemon's unix socket all live on the local host.
pass out quick on lo0 all

# Default-deny direct outbound web traffic for the agent uid. Everything the
# run legitimately needs rides through the loopback proxy (allowed above),
# which then egresses as the WORKER process — not the agent uid. Both tcp AND
# udp: udp/443 is QUIC / HTTP-3, which curl, modern browsers, and some HTTP
# libraries speak natively — a tcp-only rule leaves an https bypass that never
# touches the proxy.
block out quick proto {tcp, udp} from any to any port {80, 443} user __AGENT_UID__

# NOTE: ports other than 80/443 are not blocked by this template (DNS, ssh,
# etc. stay open). Tighten to `port 1:65535` on a box where the agent needs no
# direct non-web egress at all — the per-run proxy still tunnels arbitrary
# ports via CONNECT for allowlisted hosts.

# FOLLOW-UP (#108b) — gated on one week of observe-mode host data. Do NOT enable
# this before that data exists: a full-port block breaks DNS (udp/53), ssh, and
# any repo whose tests talk to a local service on a non-web port, and each break
# manifests as a run that dies in seconds with no output — the exact forensics
# class this work exists to eliminate.
# pass  out quick proto udp from any to any port 53   user __AGENT_UID__
# block out quick proto {tcp, udp} from any to any    user __AGENT_UID__
